<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 32px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }
        .app-title {
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .input-group {
            display: flex;
            margin-bottom: 24px;
        }
        .task-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px 0 0 12px;
            font-size: 1rem;
            transition: border 0.3s ease;
        }
        .task-input:focus {
            outline: none;
            border-color: #6a11cb;
        }
        .add-btn {
            padding: 14px 24px;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 0 12px 12px 0;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .add-btn:hover {
            opacity: 0.9;
        }
        .filters {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
        }
        .filter-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            margin: 0 4px;
            font-size: 0.95rem;
            color: #666;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }
        .filter-btn:hover:not(.active) {
            background: #f0f0f0;
        }
        .task-list {
            list-style: none;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.3s ease;
        }
        .task-item:hover {
            background: #fafafa;
            border-radius: 8px;
            padding-left: 12px;
            padding-right: 12px;
        }
        .task-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #ccc;
            border-radius: 50%;
            margin-right: 16px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        .task-checkbox:checked {
            border-color: #6a11cb;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
        }
        .task-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 7px;
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .task-text {
            flex: 1;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: #aaa;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .task-item:hover .delete-btn {
            opacity: 1;
        }
        .delete-btn:hover {
            background: #ffebee;
            transform: scale(1.1);
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #666;
        }
        .clear-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .clear-btn:hover {
            background: #f5f5f5;
            color: #333;
        }
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .card {
                padding: 24px;
            }
            .app-title {
                font-size: 2rem;
            }
            .footer {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="app-title">Todo</h1>
            <div class="input-group">
                <input type="text" class="task-input" placeholder="What needs to be done?" id="new-task-input">
                <button class="add-btn" id="add-btn">Add</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <ul class="task-list" id="task-list">
                <!-- Tasks will be inserted here by JavaScript -->
            </ul>
            <div class="footer">
                <span id="items-left">4 items left</span>
                <button class="clear-btn" id="clear-completed">Clear completed</button>
            </div>
        </div>
    </div>

    <script>
        // Initial tasks: 2 active, 2 completed
        let tasks = [
            { id: 1, text: 'Learn JavaScript', completed: false },
            { id: 2, text: 'Build a todo app', completed: false },
            { id: 3, text: 'Buy groceries', completed: true },
            { id: 4, text: 'Read a book', completed: true }
        ];

        let currentFilter = 'all';

        // DOM Elements
        const taskListEl = document.getElementById('task-list');
        const newTaskInput = document.getElementById('new-task-input');
        const addBtn = document.getElementById('add-btn');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const itemsLeftEl = document.getElementById('items-left');
        const clearCompletedBtn = document.getElementById('clear-completed');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTasks();
            updateItemsLeft();
        });

        // Render tasks based on current filter
        function renderTasks() {
            const filteredTasks = tasks.filter(task => {
                if (currentFilter === 'active') return !task.completed;
                if (currentFilter === 'completed') return task.completed;
                return true;
            });

            if (filteredTasks.length === 0) {
                taskListEl.innerHTML = '<li class="empty-state">No tasks found. Add a new task!</li>';
                return;
            }

            taskListEl.innerHTML = filteredTasks.map(task => `
                <li class="task-item" data-id="${task.id}">
                    <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''}>
                    <span class="task-text ${task.completed ? 'completed' : ''}">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" aria-label="Delete task">×</button>
                </li>
            `).join('');

            // Attach event listeners to each task
            document.querySelectorAll('.task-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', toggleTask);
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', deleteTask);
            });
        }

        // Simple HTML escaping to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add new task
        function addTask() {
            const text = newTaskInput.value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now(), // simple unique id
                text,
                completed: false
            };
            tasks.push(newTask);
            newTaskInput.value = '';
            renderTasks();
            updateItemsLeft();
        }

        // Toggle task completion
        function toggleTask(e) {
            const taskId = parseInt(e.target.closest('.task-item').dataset.id);
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = e.target.checked;
                renderTasks();
                updateItemsLeft();
            }
        }

        // Delete task
        function deleteTask(e) {
            const taskId = parseInt(e.target.closest('.task-item').dataset.id);
            tasks = tasks.filter(t => t.id !== taskId);
            renderTasks();
            updateItemsLeft();
        }

        // Update items left counter
        function updateItemsLeft() {
            const activeCount = tasks.filter(t => !t.completed).length;
            itemsLeftEl.textContent = `${activeCount} ${activeCount === 1 ? 'item' : 'items'} left`;
        }

        // Set active filter
        function setFilter(filter) {
            currentFilter = filter;
            filterButtons.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderTasks();
        }

        // Clear completed tasks
        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            renderTasks();
            updateItemsLeft();
        }

        // Event listeners
        addBtn.addEventListener('click', addTask);
        newTaskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);
    </script>
</body>
</html>

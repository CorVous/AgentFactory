# grouped-mesh.yaml — example topology exercising groups, group_bindings,
# and per-node overrides (Phase 6a).
#
# Participants:
#   authority  — Lead-tier orchestrator; top supervisor; entry peer
#   analyst    — Task-tier worker in the "workers" group
#   writer     — Task-tier worker in the "workers" group
#   reviewer   — Task-tier worker in the "reviewers" group; writer submits to it
#
# Group bindings:
#   workers.escalatesTo  = authority  (both analyst and writer report up to authority)
#   workers.messagesWith = @reviewers (workers can talk to reviewers)
#   reviewers.messagesWith = @workers (reviewers can reply to workers)
#
# Per-node override:
#   writer.submitsWorkTo = reviewer  (writer submits drafts to the reviewer, not authority)
#
# Human interaction is provided by the launcher TUI (see ADR-0004).
# The former `type: relay` human node has been removed.
#
# Note: all nodes in this mesh require explicit names because they are referenced
# by structural fields — groups list them, submitsWorkTo/acceptsWorkFrom name them directly.
# See authority-mesh.yaml for an example that uses auto-generated names for workers.
#
# Launch:
#   set -a; source models.env; set +a
#   npm run mesh -- pi-sandbox/meshes/grouped-mesh.yaml
#
# Set AGENT_DEBUG=1 to see each node's resolved Habitat fields at startup:
#   AGENT_DEBUG=1 npm run mesh -- pi-sandbox/meshes/grouped-mesh.yaml

bus_root: /tmp/pi-mesh-grouped

# The peer the launcher TUI focuses on first.
entry: authority

groups:
  workers: [analyst, writer]
  reviewers: [reviewer]

group_bindings:
  workers:
    escalatesTo: authority
    messagesWith: ["@reviewers"]
  reviewers:
    messagesWith: ["@workers"]

nodes:
  - name: authority
    recipe: mesh-authority
    sandbox: /tmp/pi-mesh-grouped/authority
    acceptsWorkFrom: ["@workers"]
    task: |
      You are the authority in this mesh. Your peers are: analyst, writer, reviewer.
      Worker messages arrive as [from <peer>] prompts. When one does, coordinate
      with your peers as needed and reply via peer_send.

  - name: analyst
    recipe: mesh-node
    sandbox: /tmp/pi-mesh-grouped/analyst
    task: |
      You are the analyst in this mesh. Your supervisor is authority.
      When a research request arrives as [from <peer>] <body>,
      research it using your tools and reply with peer_send.

  - name: writer
    recipe: mesh-writer
    sandbox: /tmp/pi-mesh-grouped/writer
    # Per-node override: writer submits drafts to reviewer, not authority.
    submitsWorkTo: reviewer
    task: |
      You are the writer in this mesh. Your supervisor is authority; you submit
      drafts to reviewer. When a drafting request arrives, draft the content,
      save it to a file, then reply with the file path and a summary.

  - name: reviewer
    recipe: mesh-node
    sandbox: /tmp/pi-mesh-grouped/reviewer
    escalatesTo: authority
    acceptsWorkFrom: [writer]
    task: |
      You are the reviewer in this mesh. Your supervisor is authority.
      When a submission arrives from writer, review it for quality and completeness,
      then send feedback back via peer_send.

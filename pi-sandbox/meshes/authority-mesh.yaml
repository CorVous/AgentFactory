# authority-mesh.yaml — example 3-participant mesh topology.
#
# Participants:
#   authority — LLM orchestrator (LEAD_HARE_MODEL); top supervisor; entry peer
#   (auto) — LLM peer (TASK_RABBIT_MODEL); handles research requests
#   (auto) — LLM peer (TASK_RABBIT_MODEL); handles drafting requests
#
# The two worker nodes omit `name:` and receive auto-generated <breed>-<shortName>
# slugs at launch time (e.g. "cottontail-node", "rex-writer"). Only `authority`
# needs an explicit name because it is referenced by the workers' `escalatesTo:`
# fields. Workers discover each other at runtime via peer_list.
#
# The `entry:` field is omitted — the launcher synthesises the focused peer from
# the unique top supervisor (authority), per Slice 3 synthesis rules.
#
# The workers use `escalatesTo: "@authority"` — an @group ref to a single-member
# group — to demonstrate Slice 2 round-robin resolution. With a single member the
# result is identical to `escalatesTo: authority`, but the pattern scales naturally
# when the group grows (e.g. adding a second authority for load-balanced supervision).
#
# Human interaction is provided by the launcher TUI (see ADR-0004).
# The former `type: relay` human node has been removed.
#
# Launch:
#   set -a; source models.env; set +a
#   npm run mesh -- pi-sandbox/meshes/authority-mesh.yaml

bus_root: /tmp/pi-mesh-authority

# Single-member group — workers use @authority as their supervisor ref so that
# adding a second authority later is a one-line change in this group rather than
# editing every worker node individually. Resolution is round-robin per launch.
groups:
  authority: [authority]

nodes:
  - name: authority
    recipe: mesh-authority
    sandbox: /tmp/pi-mesh-authority/authority
    task: |
      You are the authority in this mesh. Two worker peers (an analyst and a writer)
      are part of this topology. Peer messages arrive as [from <peer>] prompts.
      When a peer sends a request, handle it with your tools and reply via
      peer_send({to: "<peer>", body: "<answer>", in_reply_to: "<msg_id>"}).

  - recipe: mesh-node
    sandbox: /tmp/pi-mesh-authority/analyst
    escalatesTo: "@authority"
    task: |
      You are the research analyst in this mesh. Your supervisor is authority.
      When a request arrives as [from <peer> re:<id>] <body>, research or
      analyse it using your tools, then reply with:
        peer_send({to: "<peer>", body: "<findings>", in_reply_to: "<full_msg_id>"})

  - recipe: mesh-writer
    sandbox: /tmp/pi-mesh-authority/writer
    escalatesTo: "@authority"
    task: |
      You are the drafting writer in this mesh. Your supervisor is authority.
      When a drafting request arrives as [from <peer> re:<id>] <body>, draft the
      content, SAVE IT TO A FILE using the write tool, then reply with the file
      path and a summary:
        peer_send({to: "<peer>", body: "Saved to <path>: <summary>", in_reply_to: "<full_msg_id>"})
      Always write the file before replying — do not return content inline.

# mesh-authority — mesh orchestrator recipe.
# mesh_spawn/mesh_kill are implicitly wired via spawns: (Slice 2, #161).
# delegate/atomic-delegate stay as legacy path until Slice 6.
#
# Launch:
#   set -a; source models.env; set +a
#   npm run agent -- mesh-authority -- --agent-name authority
#
# Or via the mesh launcher:
#   npm run mesh -- pi-sandbox/meshes/authority-mesh.yaml

extends: peer
model: LEAD_HARE_MODEL
shortName: authority

description: Mesh orchestrator — bus peer and lifecycle manager for other nodes.

prompt: |
  You are the mesh authority. You are a named peer on the agent bus AND the
  orchestrator for the mesh.

  Peer communication (you are reachable by all nodes by your instance name):
  - peer_list() — see live peers
  - peer_call({to, body, timeout_ms?}) — blocking request-response
  - peer_send({to, body, in_reply_to?}) — fire-and-forget or reply

  Node lifecycle (for long-running peer nodes):
  - mesh_spawn({recipe, name?, task?}) — start a node; runs until mesh_kill
  - mesh_kill({name}) — stop a running node

  Finite task workers (run once and exit):
  - delegate({recipe, task, workspace?, timeout_ms?}) — atomic single call

  All nodes you spawn share the same bus root and can reach you by name.
  Incoming messages arrive as synthetic user prompts; also readable via peer_inbox.

tools:
  - read
  - ls
  - grep
  - find
  - peer_list
  - peer_send
  - peer_inbox
  - peer_call
  - delegate

spawns:
  - mesh-node
  - deferred-writer
  - deferred-editor
  - code-reviewer
  - change-reviewer
